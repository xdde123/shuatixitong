*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 5px} .sub{font-size:12px;color:var(--muted)} .nav{display:flex;gap:8px;overflow:auto;padding:10px 0 0} .nav button{white-space:nowrap;border:0;background:#e9eef6;color:#516078;padding:9px 13px;border-radius:12px;font-size:13px} .nav button.active{background:var(--text);color:#fff}
main{max-width:1100px;margin:auto;padding:16px 16px 90px} .view{display:none} .view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px} .metric .label{font-size:12px;color:var(--muted)} .metric .num{font-size:26px;font-weight:800;margin-top:8px} .blue{color:var(--blue)} .green{color:var(--green)} .orange{color:var(--orange)} .red{color:var(--red)}
.section-title{font-size:17px;font-weight:800;margin:4px 0 12px} .progress{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden} .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#63b1ff);border-radius:999px}
button{cursor:pointer} .primary{background:var(--blue);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700} .danger{background:#fff0f0;color:var(--red);border:1px solid #ffd5d5;border-radius:10px;padding:9px 12px} .ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit;color:var(--text)} textarea{min-height:64px;resize:vertical} label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff} table{width:100%;border-collapse:collapse;min-width:880px} th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px} th{background:#f8fafc;color:#59677c;position:sticky;top:0} tr:hover{background:#fbfdff}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f9;font-size:12px} .done{background:#e9f8f1;color:#13895e} .warn{background:#fff5df;color:#b77908} .late{background:#fff0f0;color:#d84c4c}
.small{font-size:12px;color:var(--muted)} .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px} @media(max-width:700px){.row{grid-template-columns:1fr}}
.course-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px} .course-head{display:flex;justify-content:space-between;gap:8px} .checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px} .checks label{display:flex;align-items:center;gap:5px;color:var(--text);margin:0} .checks input{width:auto}
.notice{padding:12px;border-radius:12px;background:#eef6ff;color:#315b91;font-size:13px;margin-bottom:12px} .empty{text-align:center;color:var(--muted);padding:30px}
.footer-note{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 16px;font-size:12px;color:var(--muted);text-align:center;z-index:8}

/* ===== 上岸 2.0 智能升级 ===== */
@media(max-width:760px){
  header{padding:12px 12px 8px}
  h1{font-size:18px}
  main{padding:12px 12px 92px}
  .nav{display:none}
  .mobile-quick{display:grid!important;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 2px}
  .mobile-quick button{border:0;border-radius:12px;padding:10px 4px;background:#eef3f9;font-size:11px}
  .smart-hero{padding:18px!important}
  .smart-hero .big{font-size:42px!important}
  .quick-grid{grid-template-columns:repeat(2,1fr)!important}
  .card{padding:14px}
}
.mobile-quick{display:none}
.smart-hero{background:linear-gradient(135deg,#1f6feb,#5ba9ff);color:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(47,128,237,.22);margin-bottom:14px}
.smart-hero .big{font-size:50px;font-weight:900;line-height:1}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.quick-card .qicon{font-size:22px}.quick-card .qnum{font-size:22px;font-weight:800;margin-top:6px}.quick-card .qlabel{font-size:12px;color:var(--muted)}

.chart{width:100%;height:220px;display:block}
.chart-grid{stroke:#e8edf5;stroke-width:1}.chart-line{fill:none;stroke:#2f80ed;stroke-width:3}.chart-dot{fill:#2f80ed}

<style id="phone-desktop-style">

  }

  }
  .nav button.active{background:#172033!important;color:#fff!important}
  .grid,.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}
  .card{padding:14px!important;border-radius:16px!important;margin-bottom:10px!important}
  .smart-hero{padding:18px 16px!important;border-radius:18px!important}
  .quick-card{min-height:88px!important;border-radius:14px!important}
  .big{font-size:48px!important}
  .section-title{font-size:16px!important}
  .mobile-quick{display:none!important}
  input,select,textarea,button{font-size:16px!important}
  table{display:block!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
}

const EXAM_DATE = "2026-10-17";
const KEY = "career_exam_system_2026_v1";

function clone(x){return JSON.parse(JSON.stringify(x));}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)); if(d) return d;}catch(e){}
  return {courses:clone(BASE_COURSES), days:clone(BASE_DAYS), errors:[], mocks:[], weekly:[]};
}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state)); renderDashboard();}
function ensureAppState(){state.questions=Array.isArray(state.questions)?state.questions:[];state.quizStats=state.quizStats||{done:0,correct:0};state.settings=state.settings||{reminderHour:20,reminderMinute:0};}
ensureAppState();
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function pct(a,b){return b?Math.round(a/b*100):0;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function daysToExam(){const a=new Date(todayStr()+"T00:00:00"),b=new Date(EXAM_DATE+"T00:00:00");return Math.ceil((b-a)/86400000);}
function statusClass(s){return s==="完成"||s==="已完成"?"done":s==="未开始"?"warn":"late";}

const tabs=[["dashboard","📊 仪表盘"],["daily","📅 每日计划"],["courses","📚 课程进度"],["errors","📝 错题三刷"],["quiz","✍️ 智能刷题"],["mocks","🧪 模考追踪"],["weekly","🔄 每周复盘"],["countdown","⏳ 倒计时"],["data","💾 数据管理"]];
document.getElementById("nav").innerHTML=tabs.map((t,i)=>`<button class="${i===0?"active":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");
document.getElementById("nav").onclick=e=>{if(e.target.dataset.tab)show(e.target.dataset.tab)};
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));document.getElementById(id).classList.add("active");renderAll();window.scrollTo({top:0,behavior:"smooth"});}

function renderDashboard(){
 const cDone=state.courses.filter(c=>c.status==="已完成").length;
 const q=state.days.reduce((a,d)=>a+(+d.questions||0),0), correct=state.days.reduce((a,d)=>a+(+d.correct||0),0);
 const dDone=state.days.filter(d=>d.status==="完成").length, err=state.errors.length, mock=state.mocks.length;
 document.getElementById("dashboard").innerHTML=`
 <div class="notice">今天最重要的事：不要追求“学了很久”，要追求“课程完成 + 刷题 + 错题复盘”。</div>
 <div class="grid">
  <div class="card metric"><div class="label">距离考试</div><div class="num red">${daysToExam()}天</div></div>
  <div class="card metric"><div class="label">课程完成率</div><div class="num blue">${pct(cDone,state.courses.length)}%</div></div>
  <div class="card metric"><div class="label">累计刷题</div><div class="num green">${q}</div></div>
  <div class="card metric"><div class="label">累计正确率</div><div class="num orange">${pct(correct,q)}%</div></div>
  <div class="card metric"><div class="label">完成学习日</div><div class="num">${dDone}/${state.days.length}</div></div>
  <div class="card metric"><div class="label">错题库</div><div class="num">${err}</div></div>
  <div class="card metric"><div class="label">模考次数</div><div class="num">${mock}</div></div>
  <div class="card metric"><div class="label">今日状态</div><div class="num">${state.days.find(d=>d.date===todayStr())?.status||"待安排"}</div></div>
 </div>
 <div class="card"><div class="section-title">课程总体进度</div><div class="progress"><i style="width:${pct(cDone,state.courses.length)}%"></i></div><div class="small" style="margin-top:8px">已完成 ${cDone} / ${state.courses.length} 节</div></div>
 <div class="card"><div class="section-title">今日任务</div>${renderTodayTasks()}</div>
 <div class="card"><div class="section-title">严格执行规则</div>${RULES.map(r=>`<p><b>${esc(r.title)}</b><br><span class="small">${esc(r.text)}</span></p>`).join("")}</div>`;
}
function renderTodayTasks(){
 const d=state.days.find(x=>x.date===todayStr()) || state.days.find(x=>x.status!=="完成");
 if(!d)return '<div class="empty">全部计划已完成，保持复习和模考节奏。</div>';
 return `<div><b>${esc(d.date)}｜${esc(d.topic)}</b><p class="small">🎬 视频：${esc(d.videoTask)}</p><p class="small">✍️ 练习：${esc(d.practiceTask)}</p><p class="small">🔁 复盘：${esc(d.reviewTask)}</p><p><span class="badge ${statusClass(d.status)}">${esc(d.status)}</span> <span class="small">计划 ${d.plannedHours} 小时｜${esc(d.timeSlot)}</span></p></div>`;

function parseImportedQuestions(name,text){ensureAppState();text=(text||'').replace(/\r/g,'').replace(/\u00a0/g,' ').trim();if(!text)throw new Error('未读取到可识别文字');const chunks=text.split(/(?:^|\n)\s*(?=\d{1,4}[、\.．\)]\s*)/);let added=0;for(const raw of chunks){let c=raw.trim();if(!c)continue;const q=c.match(/^\d{1,4}[、\.．\)]\s*([\s\S]*)$/);if(!q)continue;c=q[1];const opts=[];let answer='';const am=c.match(/(?:答案|正确答案)\s*[：: ]\s*([A-D])/i);if(am){answer=am[1].toUpperCase();c=c.replace(am[0],'');}const parts=c.split(/\n\s*([A-D])[\.、．、\s]+/i);let stem=parts[0].trim();for(let i=1;i<parts.length;i+=2){const letter=parts[i].toUpperCase(), val=(parts[i+1]||'').trim();opts.push({letter,text:val});}if(opts.length<2){const inline=c.match(/([A-D])[\.、．]\s*([^A-D\n]+?)(?=\s+[A-D][\.、．]|$)/gi);if(inline){for(const x of inline){const m=x.match(/^([A-D])[\.、．]\s*([\s\S]*)$/i);if(m)opts.push({letter:m[1].toUpperCase(),text:m[2].trim()});}stem=c.replace(/\s*[A-D][\.、．][\s\S]*/,'').trim();}}if(stem&&opts.length>=2){state.questions.push({id:Date.now()+added,source:name,stem,options:opts,answer,createdAt:todayStr()});added++;}}
if(!added)throw new Error('没有识别到标准选择题格式');save();return added;}

/* ===== 智能备考 2.0 ===== */
function isoAdd(date,n){const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function dateDiff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)}
function studyStreak(){
  const done=new Set(state.days.filter(d=>d.status==="完成").map(d=>d.date));
  let cur=todayStr(), streak=0;
  if(!done.has(cur)) cur=isoAdd(cur,-1);
  while(done.has(cur)){streak++;cur=isoAdd(cur,-1)}
  return streak;
}
function studyTrend(){
  const arr=state.days.filter(d=>(+d.questions||0)>0 || (+d.actualHours||0)>0).slice(-14);
  return arr.map(d=>({date:d.date.slice(5),hours:+d.actualHours||0,accuracy:pct(+d.correct||0,+d.questions||0)}));
}
function svgTrend(data){
  if(!data.length)return '<div class="empty">完成每日打卡后，这里会自动生成学习趋势图。</div>';
  const w=700,h=220,p=28,max=Math.max(1,...data.map(x=>x.hours));
  const pts=data.map((x,i)=>({x:p+i*((w-2*p)/Math.max(1,data.length-1)),y:h-p-(x.hours/max)*(h-2*p)}));
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line class="chart-grid" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/>
    <line class="chart-grid" x1="${p}" y1="${p}" x2="${w-p}" y2="${p}"/>
    <polyline class="chart-line" points="${poly}"/>
    ${pts.map((pt,i)=>`<circle class="chart-dot" cx="${pt.x}" cy="${pt.y}" r="4"><title>${data[i].date}：${data[i].hours}小时</title></circle>`).join("")}
    ${data.map((x,i)=>`<text x="${pts[i].x}" y="${h-7}" text-anchor="middle" font-size="10" fill="#728096">${x.date}</text>`).join("")}
  </svg>`;
}
function weakModules(){
  const map={};
  state.courses.forEach(c=>{
    if(!map[c.module])map[c.module]={scores:[],errors:0};
    if(c.accuracy!=="" && c.accuracy!=null) map[c.module].scores.push(+c.accuracy);
  });
  state.errors.forEach(e=>{if(e.module){if(!map[e.module])map[e.module]={scores:[],errors:0};map[e.module].errors++}});
  return Object.entries(map).map(([name,v])=>{
    const acc=v.scores.length?v.scores.reduce((a,b)=>a+b,0)/v.scores.length:60;
    const score=100-acc+Math.min(v.errors*3,30);
    return {name,acc:Math.round(acc),errors:v.errors,score};
  }).sort((a,b)=>b.score-a.score);
}
function delayInfo(){
  const today=todayStr();
  let unfinished=state.days.filter(d=>d.date<today && d.status!=="完成").sort((a,b)=>a.date.localeCompare(b.date));
  let consecutive=0;
  for(let i=state.days.length-1;i>=0;i--){
    const d=state.days[i];
    if(d.date>today)continue;
    if(d.status==="完成")break;
    if(d.status==="未开始"||d.status==="进行中"||d.status==="补债")consecutive++;
  }
  return {unfinished,consecutive};
}
function levelInfo(){
  const cRate=pct(state.courses.filter(c=>c.status==="已完成").length,state.courses.length);
  const q=state.days.reduce((a,d)=>a+(+d.questions||0),0);
  const correct=state.days.reduce((a,d)=>a+(+d.correct||0),0);
  const acc=pct(correct,q), streak=studyStreak(), mocks=state.mocks.length;
  const score=Math.round(cRate*.45+acc*.35+Math.min(streak,14)/14*10+Math.min(mocks,6)/6*10);
  let name="起步者",icon="🌱";
  if(score>=85){name="冲刺王者";icon="👑"} else if(score>=70){name="上岸强者";icon="🏆"} else if(score>=50){name="稳定进阶";icon="🚀"} else if(score>=30){name="持续积累";icon="🔥"}
  return {score,name,icon,cRate,acc,streak,mocks};
}
function recommendations(){
  const today=todayStr(), r=[];
  const d=state.days.find(x=>x.date===today);
  const overdue3=state.errors.filter(e=>!e.review1&&e.review1Date<=today).length;
  const overdue7=state.errors.filter(e=>!e.review2&&e.review2Date<=today).length;
  if(overdue3||overdue7)r.push(`优先完成错题复习：3天复习 ${overdue3} 道，7天复习 ${overdue7} 道。`);
  if(d)r.push(`今日主线：${d.topic}；先完成“${d.videoTask}”，再完成“${d.practiceTask}”。`);
  const weak=weakModules()[0];
  if(weak)r.push(`薄弱模块优先：${weak.name}（当前综合评估偏弱），额外安排 20—40 分钟针对性训练。`);
  const di=delayInfo();
  if(di.unfinished.length)r.push(`补债任务：优先处理 ${di.unfinished[0].date} 的未完成计划，避免欠账继续滚动。`);
  return r.slice(0,4);
}
function mobileQuick(){

  </div>`;
}
function renderDashboard(){
 const li=levelInfo(), trend=studyTrend(), weak=weakModules().slice(0,3), delay=delayInfo(), recs=recommendations();
 const q=state.days.reduce((a,d)=>a+(+d.questions||0),0), correct=state.days.reduce((a,d)=>a+(+d.correct||0),0);
 const todayDone=state.days.find(d=>d.date===todayStr())?.status==="完成";
 document.getElementById("dashboard").innerHTML=`

 <div class="smart-hero">

   <div class="hero-sub">距离考试剩余时间。今天的每一次完成，都在拉近上岸距离。</div>
 </div>
 <div class="quick-grid">
  <button class="quick-card" onclick="show('daily')"><div class="qicon">🔥</div><div class="qnum">${li.streak}天</div><div class="qlabel">连续打卡</div></button>
  <button class="quick-card" onclick="show('courses')"><div class="qicon">📚</div><div class="qnum">${li.cRate}%</div><div class="qlabel">课程完成率</div></button>
  <button class="quick-card" onclick="show('errors')"><div class="qicon">🎯</div><div class="qnum">${li.acc}%</div><div class="qlabel">累计正确率</div></button>
  <button class="quick-card" onclick="show('mocks')"><div class="qicon">🧪</div><div class="qnum">${li.mocks}</div><div class="qlabel">模考次数</div></button>
  <button class="quick-card" onclick="show('quiz')"><div class="qicon">✍️</div><div class="qnum">${state.questions?.length||0}</div><div class="qlabel">在线刷题</div></button>
 </div>
 <div class="card"><div class="section-title">📅 智能推荐：今天优先做什么</div>
   ${recs.map((x,i)=>`<div class="reco"><b>优先级 ${i+1}</b>　${esc(x)}</div>`).join("") || '<div class="empty">今天没有计划任务。</div>'}
 </div>
 ${delay.consecutive>=2?`<div class="card"><div class="section-title">🚨 连续拖延预警</div><div class="alert">你当前已连续 ${delay.consecutive} 个计划日未完成。建议立即停止继续新增任务，先完成最早的“补债任务”。</div></div>`:
 `<div class="card"><div class="section-title">🟢 执行状态</div><div class="good">${todayDone?"今天已完成计划，继续安排错题复习或薄弱模块训练。":"今天还未完成打卡。请优先完成今日主线任务。"}</div></div>`}
 <div class="card"><div class="section-title">📈 近14次学习趋势</div>${svgTrend(trend)}<div class="small">曲线反映每日实际学习时长。持续稳定比偶尔突击更重要。</div></div>
 <div class="card"><div class="section-title">🧠 薄弱模块智能判断</div>
   ${weak.length?weak.map((w,i)=>`<p><b>${i+1}. ${esc(w.name)}</b> <span class="badge ${i===0?'late':'warn'}">综合薄弱度 ${w.score}</span><br><span class="small">课程平均正确率：${w.acc}%｜已记录错题：${w.errors} 道</span></p>`).join(""):'<div class="empty">完成课程并填写正确率后，系统会自动判断薄弱模块。</div>'}
 </div>
 <div class="card"><div class="section-title">🏆 上岸进度等级说明</div>
   <div class="small">🌱 起步者 → 🔥 持续积累 → 🚀 稳定进阶 → 🏆 上岸强者 → 👑 冲刺王者</div>
   <div class="progress" style="margin-top:10px"><i style="width:${li.score}%"></i></div>
   <div class="small" style="margin-top:8px">等级综合参考课程完成率、刷题正确率、连续打卡和模考执行情况。</div>
 </div>`;
}

    console.error(err);
    const main=document.querySelector("main");
    if(main){
      main.innerHTML='<div class="card" style="margin-top:20px"><h2 style="margin-top:0">管理系统启动异常</h2><p>请不要在文件管理器内置预览器中打开本文件。</p><p><b>正确方式：</b>使用 Chrome 或 Edge 浏览器打开，然后添加到手机桌面。</p><p style="color:#728096;font-size:13px">错误信息：'+String(err.message||err).replace(/[<>&]/g,"")+'</p></div>';
    }

}
window.addEventListener("error",function(e){console.error(e.error||e.message);});
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootSystem, {once:true});
} else {

}

/* ===== 真正的刷题系统 3.0 ===== */
if(!state.questionBanks) state.questionBanks=[];
if(!state.quizStats) state.quizStats={answered:0,correct:0,totalSeconds:0,streak:0};
if(!state.quizHistory) state.quizHistory=[];
let quizSession=null, quizTimer=null;
function qid(){return 'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function normalizeOption(x){return String(x||'').replace(/^[A-DＡ-Ｄ][\.、．\)）]\s*/i,'').trim()}
function parseImportedQuestions(name,text){
 const clean=String(text||'').replace(/\r/g,'\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
 const parts=clean.split(/(?=\n?\s*\d{1,4}[\.、．、]\s*)/).map(x=>x.trim()).filter(x=>x.length>8);
 const qs=[];
 for(const part of parts){
   const opts=[]; const om=part.match(/(?:^|\n|\s)([A-DＡ-Ｄ])[\.、．\)）]\s*([^\n]+?)(?=(?:\n|\s)[A-DＡ-Ｄ][\.、．\)）]|\n?(?:答案|解析)\s*[:：]|$)/g);
   if(om&&om.length>=2){
     om.forEach(z=>opts.push(normalizeOption(z)));
     let stem=part.slice(0,part.indexOf(om[0])).replace(/^\s*\d+[\.、．、]\s*/,'').trim();
     let ans=(part.match(/(?:答案|参考答案)\s*[:：]\s*([A-DＡ-Ｄ])/i)||[])[1]||'';
     ans=ans.replace('Ａ','A').replace('Ｂ','B').replace('Ｃ','C').replace('Ｄ','D');
     let analysis=(part.match(/(?:解析|答案解析)\s*[:：]([\s\S]*)$/i)||[])[1]||'';
     qs.push({id:qid(),stem,options:opts.slice(0,4),answer:ans,analysis:analysis.trim(),source:name,category:'导入题库'});
   }
 }
 return qs;
}
function receiveImportedQuestionText(name,text){
 const qs=parseImportedQuestions(name,text);
 if(!qs.length){alert('未能自动识别出标准选择题。请确保题目格式类似：1. 题干\\nA. 选项\\nB. 选项\\n答案：A');return}
 state.questionBanks.push({id:'bank_'+Date.now(),name:name,count:qs.length,createdAt:new Date().toLocaleString(),questions:qs}); save(); alert('成功导入 '+qs.length+' 道题'); renderQuiz();
}
function startQuiz(mode){
 const all=state.questionBanks.flatMap(b=>b.questions||[]); if(!all.length){alert('请先导入 PDF、Word 或 TXT 题库');return}
 let qs=[...all]; if(mode==='random') qs.sort(()=>Math.random()-.5);
 quizSession={mode,questions:qs,index:0,answers:{},started:Date.now(),startItem:Date.now()};
 clearInterval(quizTimer); quizTimer=setInterval(()=>{const el=document.getElementById('quizTimer');if(el&&quizSession){const sec=Math.floor((Date.now()-quizSession.started)/1000);el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}},1000);
 renderQuiz();
}
function answerQuiz(letter){if(!quizSession)return;quizSession.answers[quizSession.index]=letter;renderQuiz()}
function nextQuiz(step){if(!quizSession)return;quizSession.index=Math.max(0,Math.min(quizSession.questions.length-1,quizSession.index+step));renderQuiz()}
function finishQuiz(){if(!quizSession)return;clearInterval(quizTimer);const qn=quizSession.questions.length;let correct=0;const now=Date.now();
 quizSession.questions.forEach((q,i)=>{const a=quizSession.answers[i]||'';const ok=a&&a===q.answer;if(ok)correct++;else if(a){state.errors.unshift({id:'quizerr_'+qid(),date:todayStr(),module:q.category||'智能刷题',point:(q.stem||'').slice(0,30),reason:'在线刷题答错：选择 '+a+'，正确答案 '+q.answer,method:q.analysis||'请复习题目解析',review1:false,review2:false,review1Date:isoAdd(todayStr(),3),review2Date:isoAdd(todayStr(),7)});}});
 const used=Math.floor((now-quizSession.started)/1000); state.quizStats.answered+=qn;state.quizStats.correct+=correct;state.quizStats.totalSeconds+=used;state.quizStats.streak=(correct===qn)?state.quizStats.streak+1:0;state.quizHistory.unshift({date:new Date().toLocaleString(),mode:quizSession.mode,count:qn,correct,seconds:used});quizSession=null;save();renderQuiz();alert('本次完成：'+correct+'/'+qn+'，错误题已自动加入错题本');}
function deleteBank(id){if(!confirm('确定删除该题库吗？'))return;state.questionBanks=state.questionBanks.filter(b=>b.id!==id);save();renderQuiz()}
function renderQuiz(){const root=document.getElementById('quiz');if(!root)return;const all=state.questionBanks.flatMap(b=>b.questions||[]);const st=state.quizStats||{answered:0,correct:0,totalSeconds:0,streak:0};
 if(!quizSession){root.innerHTML=`<div class="card"><div class="section-title">✍️ 真正的刷题系统 3.0</div><div class="notice">流程：PDF/Word/TXT 导入 → 自动识别选择题 → 生成题库 → 顺序/随机刷题 → 计时 → 自动判分 → 错题自动入库 → 数据统计</div><div class="grid"><div class="card metric"><div class="label">题库数量</div><div class="num blue">${state.questionBanks.length}</div></div><div class="card metric"><div class="label">可刷题目</div><div class="num green">${all.length}</div></div><div class="card metric"><div class="label">累计答题</div><div class="num orange">${st.answered}</div></div><div class="card metric"><div class="label">正确率</div><div class="num red">${pct(st.correct,st.answered)}%</div></div></div><div class="toolbar"><button class="primary" onclick="Android&&Android.pickQuestionFile?Android.pickQuestionFile():alert('请在安卓App内导入')">📂 导入 PDF / Word / TXT</button><button class="ghost" onclick="startQuiz('order')">▶ 顺序刷题</button><button class="ghost" onclick="startQuiz('random')">🎲 随机刷题</button></div><div class="small">支持标准选择题格式。扫描版 PDF 需先进行 OCR；导入后建议抽查题干和答案是否识别正确。</div></div><div class="card"><div class="section-title">📚 我的题库</div>${state.questionBanks.length?state.questionBanks.map(b=>`<div class="course-card"><div class="course-head"><b>${esc(b.name)}</b><button class="danger" onclick="deleteBank('${b.id}')">删除</button></div><div class="small">${b.count} 道｜导入时间：${esc(b.createdAt)}</div></div>`).join(''):'<div class="empty">暂未导入题库</div>'}</div><div class="card"><div class="section-title">📊 最近刷题记录</div>${(state.quizHistory||[]).slice(0,8).map(x=>`<p><b>${x.mode==='random'?'随机刷题':'顺序刷题'}</b>：${x.correct}/${x.count}，正确率 ${pct(x.correct,x.count)}%，用时 ${Math.floor(x.seconds/60)} 分钟<br><span class="small">${esc(x.date)}</span></p>`).join('')||'<div class="empty">完成刷题后自动生成记录</div>'}</div>`;return}
 const q=quizSession.questions[quizSession.index], chosen=quizSession.answers[quizSession.index]||'', letters=['A','B','C','D'];
 root.innerHTML=`<div class="card"><div class="course-head"><div><b>第 ${quizSession.index+1}/${quizSession.questions.length} 题</b><div class="small">${quizSession.mode==='random'?'随机模式':'顺序模式'} · 本次用时 <span id="quizTimer">0:00</span></div></div><button class="danger" onclick="finishQuiz()">交卷并判分</button></div><div class="progress" style="margin:12px 0"><i style="width:${((quizSession.index+1)/quizSession.questions.length*100).toFixed(1)}%"></i></div><div style="font-size:17px;line-height:1.7;margin:18px 0"><b>${esc(q.stem)}</b></div><div class="checks" style="display:block">${q.options.map((o,i)=>`<button class="ghost" style="display:block;width:100%;text-align:left;margin:10px 0;${chosen===letters[i]?'border:2px solid var(--blue);background:#eef6ff':''}" onclick="answerQuiz('${letters[i]}')"><b>${letters[i]}.</b> ${esc(o)}</button>`).join('')}</div><div class="toolbar" style="margin-top:16px"><button class="ghost" onclick="nextQuiz(-1)">← 上一题</button><button class="primary" onclick="nextQuiz(1)">下一题 →</button></div></div>`}

</script>
